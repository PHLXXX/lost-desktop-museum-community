name: Weekly integrity check
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Integrity summary
        if: always()
        run: echo "## Weekly catalog and package integrity check" >> "$GITHUB_STEP_SUMMARY"
